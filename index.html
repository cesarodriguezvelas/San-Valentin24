<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>San Valentín - No hay escapatoria 😈</title>
<style>
body {
  text-align: center;
  font-family: 'Comic Sans MS', 'Arial', sans-serif;
  background: linear-gradient(45deg, #ffe6f0, #fff0f5);
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
}

.container {
  background-color: rgba(255, 255, 255, 0.9);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
  border: 3px dashed #ff69b4;
  max-width: 600px;
  width: 90%;
  transition: all 0.5s ease;
  z-index: 10;
}

.container.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  max-width: none;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(45deg, #ff4d88, #ff1a4c);
  border: none;
  margin: 0;
  padding: 0;
  z-index: 1000;
}

.container.fullscreen h1 {
  color: white;
  font-size: 4em;
  text-shadow: 5px 5px 0 rgba(0,0,0,0.2);
}

.container.fullscreen .subtitle,
.container.fullscreen .joke-bubble,
.container.fullscreen .funny-face,
.container.fullscreen .encouragement {
  display: none;
}

.container.fullscreen .buttons {
  transform: scale(2);
}

.container.fullscreen .no-button {
  display: none;
}

.container.fullscreen .yes-button {
  background-color: white;
  color: #ff4d88;
  font-size: 3em !important;
  padding: 30px 80px !important;
  border: 5px solid #ff1a4c;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 {
  color: #d63384;
  font-size: 2.5em;
  text-shadow: 2px 2px 0 #ffb6c1;
  margin-bottom: 20px;
}

.subtitle {
  font-size: 1.2em;
  color: #ff4d6d;
  margin-bottom: 30px;
  background: #fff0f5;
  padding: 10px;
  border-radius: 50px;
  border: 2px solid #ffb6c1;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-top: 30px;
  transition: all 0.3s ease;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  margin: 10px;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  font-family: 'Comic Sans MS', 'Arial', sans-serif;
  font-weight: bold;
  transition: all 0.3s ease;
  box-shadow: 0 5px 0 rgba(0,0,0,0.1);
  position: relative;
  z-index: 100;
}

.yes-button {
  background-color: #ff4d88;
  color: white;
  border: 2px solid #ff1a4c;
  transform-origin: center;
}

.yes-button:hover {
  transform: scale(1.05);
  background-color: #ff3385;
}

.no-button {
  background-color: #e0e0e0;
  color: #666;
  border: 2px solid #b3b3b3;
  transition: all 0.2s ease;
}

.no-button:hover {
  background-color: #d4d4d4;
}

.joke-bubble {
  background-color: white;
  border-radius: 20px;
  padding: 10px 20px;
  margin: 10px auto;
  max-width: 300px;
  border: 2px solid #ffb6c1;
  position: relative;
  font-size: 1.1em;
}

.joke-bubble::before {
  content: "💭";
  position: absolute;
  left: -30px;
  top: -10px;
  font-size: 30px;
}

.funny-face {
  font-size: 50px;
  margin: 10px;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.encouragement {
  background: #ffeb3b;
  color: #333;
  padding: 5px 15px;
  border-radius: 20px;
  font-weight: bold;
  display: inline-block;
  margin: 10px;
  transform: rotate(-2deg);
}

/* Efecto de temblor para el botón No */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.shake {
  animation: shake 0.2s ease-in-out;
}
</style>
</head>

<body>
<div class="container" id="mainContainer">
  <div class="funny-face">😅🥺😂</div>
  <h1>🫣 ¿Quieres ser mi San Valentín? 🫣</h1>
  
  <div class="buttons">
    <button class="yes-button" onclick="handleYesClick()" id="yesButton">¡Sí, claro que sí! 💖</button>
    <button class="no-button" onclick="handleNoClick()" id="noButton">No 😅</button>
  </div>
  
  <div class="encouragement" id="encouragement">
    ¡El amor te espera! 💕
  </div>
</div>

<script>
let messageIndex = 0;
let noClickCount = 0;
let yesButtonSize = 20;

const messages = [
  "¿Segura? 😱",
  "¿Y si lo piensas? 🍫",
  "Mira que tengo memes 🤡",
  "Vamos, anímate 🙈",
  "El amor llama a tu puerta 🚪",
  "No me dejes así 😭",
  "Última oportunidad... 👀",
  "Te vas a arrepentir 😰",
  "Mira que el otro botón ya es enorme 👀",
  "¡YA CASI GANA EL SÍ! 🏆"
];

const jokes = [
  "¿De verdad quieres seguir diciendo que no? 🤔",
  "Cada 'No' hace más fuerte el 'Sí' 💪",
  "La terquedad tiene premio... y es el botón grande 🎁",
  "Este botón se está cansando de decir 'No' 😴",
  "El amor es persistente... como este botón ❤️",
  "Tu dedo debe estar rojo de tanto clic 🖐️",
  "El botón rosa te está mirando... fijamente 👀",
  "10 'No' y el botón explota... literal 💥",
  "¿Hasta dónde crees que puede crecer? 📏",
  "El final se acerca... y es ROSA 🌸"
];

const encouragements = [
  "¡Dile que sí al amor! 💕",
  "No tengas miedo... bueno, un poquito sí 😈",
  "El botón rosa nunca pierde 🌸",
  "Haz clic en el botón grande... el bonito ✨",
  "La resistencia es inútil 🦸‍♂️",
  "El amor (y mi código) siempre gana 💻",
  "Solo di que sí y serás libre... o no 😜"
];

function handleNoClick() {
  const noButton = document.getElementById('noButton');
  const yesButton = document.getElementById('yesButton');
  const jokeBox = document.getElementById('jokeBox');
  const encouragement = document.getElementById('encouragement');
  const container = document.getElementById('mainContainer');
  
  noClickCount++;
  
  // Cambiar el texto del botón No
  noButton.textContent = messages[Math.min(messageIndex, messages.length - 1)];
  messageIndex = (messageIndex + 1) % messages.length;
  
  // Hacer crecer el botón Sí
  if (noClickCount < 10) {
    yesButtonSize = 20 + (noClickCount * 8);
    yesButton.style.fontSize = `${yesButtonSize}px`;
    yesButton.style.padding = `${15 + noClickCount}px ${30 + (noClickCount * 3)}px`;
    
    // Cambiar el chiste
    jokeBox.textContent = jokes[Math.floor(Math.random() * jokes.length)];
    
    // Cambiar mensaje de ánimo
    encouragement.textContent = encouragements[Math.floor(Math.random() * encouragements.length)];
    
    // Hacer el botón No más pequeño
    const noCurrentSize = parseFloat(window.getComputedStyle(noButton).fontSize);
    if (noCurrentSize > 8) {
      noButton.style.fontSize = `${noCurrentSize * 0.85}px`;
    }
    
    // Efecto de temblor
    noButton.classList.add('shake');
    setTimeout(() => {
      noButton.classList.remove('shake');
    }, 200);
    
  } else if (noClickCount === 10) {
    // ¡EN LA DÉCIMA VEZ, EL BOTÓN SÍ ACAPARA TODO!
    container.classList.add('fullscreen');
    
    // Hacer que el botón Sí sea gigante
    yesButton.style.fontSize = '4em';
    yesButton.style.padding = '30px 80px';
    
    // Hacer invisible el botón No
    noButton.style.opacity = '0';
    noButton.style.pointerEvents = 'none';
    
    // Mensaje épico
    jokeBox.textContent = "¡No hay escapatoria! El SÍ ha conquistado el mundo 🌎";
    
    // Pequeña animación de celebración
    for (let i = 0; i < 15; i++) {
      setTimeout(() => {
        const emoji = document.createElement('div');
        emoji.style.position = 'fixed';
        emoji.style.left = Math.random() * 100 + '%';
        emoji.style.top = '-10%';
        emoji.style.fontSize = (Math.random() * 40 + 20) + 'px';
        emoji.style.animation = 'bounce 2s linear forwards';
        emoji.innerHTML = ['❤️','💖','💕','🎉','🥳','👑','🏆','💪'][Math.floor(Math.random() * 8)];
        emoji.style.zIndex = '2000';
        document.body.appendChild(emoji);
        
        setTimeout(() => {
          emoji.remove();
        }, 1900);
      }, i * 100);
    }
  }
}

function handleYesClick() {
  const container = document.getElementById('mainContainer');
  
  container.innerHTML = `
    <div style="animation: bounce 1s">
      <div class="funny-face">🎉🥳💖</div>
      <h1 style="color: #d63384;">¡POR FIN! 💘</h1>
      <div style="font-size: 30px; margin: 20px;">🫂</div>
      <div class="joke-bubble" style="font-size: 1.3em;">
        "Después de ${noClickCount} intentos de decir que no... 
        <br>¡El amor siempre gana! 🏆"
      </div>
      <p style="font-size: 1.5em; margin: 20px;">¡Vamos a celebrar! 🎊</p>
      <p style="color: #666;">El botón gigante siempre cumple su misión 💪</p>
    </div>
  `;
  
  // Lluvia de emojis
  for (let i = 0; i < 25; i++) {
    setTimeout(() => {
      const emoji = document.createElement('div');
      emoji.style.position = 'fixed';
      emoji.style.left = Math.random() * 100 + '%';
      emoji.style.top = '-10%';
      emoji.style.fontSize = (Math.random() * 30 + 20) + 'px';
      emoji.style.animation = 'bounce 2s linear forwards';
      emoji.innerHTML = ['❤️','💖','💕','😂','🥰','🎉','🎊','✨'][Math.floor(Math.random() * 8)];
      emoji.style.zIndex = '1000';
      document.body.appendChild(emoji);
      
      setTimeout(() => {
        emoji.remove();
      }, 1900);
    }, i * 100);
  }
}
</script>

<style>
/* Responsive */
@media (max-width: 768px) {
  .container.fullscreen .yes-button {
    font-size: 2em !important;
    padding: 20px 40px !important;
  }
  
  .container.fullscreen h1 {
    font-size: 2.5em;
  }
}
</style>
</body>
</html>
