<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Serás mi San Valentín? 💕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(145deg, #ffb6c1 0%, #ffc0cb 50%, #ffd1dc 100%);
  position: relative;
  overflow: hidden;
}

/* Corazones flotantes */
body::before,
body::after {
  content: "❤️";
  position: absolute;
  font-size: 20px;
  opacity: 0.3;
  animation: float 6s infinite ease-in-out;
}

body::before {
  top: 20%;
  left: 10%;
  animation-delay: 0s;
}

body::after {
  top: 70%;
  right: 10%;
  animation-delay: 3s;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(10deg); }
}

.container {
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px);
  border-radius: 30px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(214, 51, 132, 0.3),
              0 0 0 2px rgba(255, 255, 255, 0.5) inset;
  max-width: 600px;
  width: 90%;
  position: relative;
  z-index: 10;
  border: 1px solid rgba(255, 255, 255, 0.8);
}

h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 3rem;
  color: #d61c4e;
  text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
  margin-bottom: 20px;
  letter-spacing: 2px;
}

h1 span {
  display: inline-block;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.1); }
  30% { transform: scale(1.2); }
  50% { transform: scale(1); }
}

.message {
  font-size: 1.2rem;
  color: #a63c5e;
  margin-bottom: 30px;
  font-weight: 500;
  background: rgba(255, 240, 245, 0.7);
  padding: 10px 20px;
  border-radius: 50px;
  display: inline-block;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

button {
  padding: 15px 40px;
  font-size: 1.5rem;
  border: none;
  border-radius: 60px;
  cursor: pointer;
  font-family: 'Quicksand', sans-serif;
  font-weight: 600;
  letter-spacing: 1px;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
}

.yes-button {
  background: linear-gradient(135deg, #ff4d8c, #ff1a4c);
  color: white;
  border: 2px solid #fff5f8;
}

.yes-button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #ff4d8c;
}

.yes-button::before {
  content: "💘";
  position: absolute;
  left: -30px;
  top: 50%;
  transform: translateY(-50%);
  transition: left 0.3s ease;
}

.yes-button:hover::before {
  left: 10px;
}

.no-button {
  background: linear-gradient(135deg, #ffb6c1, #ff99aa);
  color: #8a4a5c;
  border: 2px solid white;
  min-width: 120px;
}

.no-button:hover {
  background: linear-gradient(135deg, #ffc0cb, #ffa5b9);
  transform: scale(0.95);
}

/* Efecto de brillo */
.glow {
  position: absolute;
  width: 150px;
  height: 150px;
  background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
}

/* Corazones decorativos */
.hearts {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.hearts span {
  position: absolute;
  font-size: 24px;
  animation: floatHeart 8s infinite;
  opacity: 0.6;
}

@keyframes floatHeart {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
}

.hearts span:nth-child(1) { left: 5%; animation-duration: 7s; }
.hearts span:nth-child(2) { left: 20%; animation-duration: 9s; animation-delay: 1s; }
.hearts span:nth-child(3) { left: 40%; animation-duration: 8s; animation-delay: 2s; }
.hearts span:nth-child(4) { left: 60%; animation-duration: 10s; animation-delay: 0.5s; }
.hearts span:nth-child(5) { left: 80%; animation-duration: 7.5s; animation-delay: 1.5s; }
.hearts span:nth-child(6) { left: 95%; animation-duration: 8.5s; animation-delay: 2.5s; }

/* Mensaje final */
.final-message {
  font-family: 'Dancing Script', cursive;
  font-size: 4rem;
  color: #d61c4e;
  text-shadow: 3px 3px 6px rgba(255, 255, 255, 0.9);
  animation: fadeIn 2s ease;
  padding: 20px;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(5px);
  border-radius: 40px;
  border: 2px solid white;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>

<div class="hearts">
  <span>❤️</span>
  <span>💖</span>
  <span>💕</span>
  <span>💗</span>
  <span>💓</span>
  <span>💘</span>
</div>

<div class="container" id="mainContainer">
  <h1>¿Quieres ser mi <span>San Valentín</span>? 💕</h1>
  <div class="message">Mi corazón late solo por ti...</div>
  
  <div class="buttons">
    <button class="yes-button" onclick="handleYesClick()">Sí</button>
    <button class="no-button" onclick="handleNoClick()">No</button>
  </div>
</div>

<script>
let messageIndex = 0;

const messages = [
  "¿Segura? 💕",
  "Piénsalo bien... 💗",
  "Seríamos tan felices 💖",
  "Mira que sin ti me muero 💘",
  "¿Y si le das otra oportunidad? 💝",
  "Tu sonrisa es mi debilidad 💓",
  "Bueno... ¡ya no acepto negativas! 💞"
];

function handleNoClick() {
  const noButton = document.querySelector('.no-button');
  const yesButton = document.querySelector('.yes-button');
  const message = document.querySelector('.message');
  
  // Cambiar el mensaje del botón "No"
  noButton.textContent = messages[messageIndex];
  messageIndex = (messageIndex + 1) % messages.length;
  
  // Hacer el botón "Sí" más grande y más hermoso
  const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
  yesButton.style.fontSize = `${currentSize * 1.2}px`;
  yesButton.style.padding = `${15 * (currentSize/20)}px ${40 * (currentSize/20)}px`;
  
  // Cambiar el mensaje romántico
  const romanticMessages = [
    "Cada latido es para ti... 💓",
    "Eres la dueña de mis sueños ✨",
    "Mi amor por ti crece 💝",
    "Juntos seríamos el mejor cuento 💕",
    "Eres perfecta para mí 💖"
  ];
  
  message.textContent = romanticMessages[Math.floor(Math.random() * romanticMessages.length)];
  
  // Añadir corazones voladores
  const heart = document.createElement('span');
  heart.innerHTML = '❤️';
  heart.style.position = 'fixed';
  heart.style.left = Math.random() * 100 + '%';
  heart.style.top = '100%';
  heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
  heart.style.animation = 'floatHeart 3s linear forwards';
  heart.style.zIndex = '1000';
  document.body.appendChild(heart);
  
  setTimeout(() => {
    heart.remove();
  }, 3000);
}

function handleYesClick() {
  const container = document.getElementById('mainContainer');
  container.innerHTML = "<h1 class='final-message'>Sabía que dirías que sí ❤️<br>Te amaré por siempre 💘</h1>";
  
  // Lluvia de corazones
  for(let i = 0; i < 30; i++) {
    setTimeout(() => {
      const heart = document.createElement('span');
      heart.innerHTML = ['❤️','💖','💕','💗','💓','💘','💝'][Math.floor(Math.random() * 7)];
      heart.style.position = 'fixed';
      heart.style.left = Math.random() * 100 + '%';
      heart.style.top = '-10%';
      heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
      heart.style.animation = 'floatHeart 4s linear forwards';
      heart.style.zIndex = '1000';
      document.body.appendChild(heart);
      
      setTimeout(() => {
        heart.remove();
      }, 4000);
    }, i * 100);
  }
}
</script>

</body>
</html>
