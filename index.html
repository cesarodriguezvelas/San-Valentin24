<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>San Valentín - Edición Humorística 😂</title>
<style>
body {
  text-align: center;
  font-family: 'Comic Sans MS', 'Arial', sans-serif;
  background: linear-gradient(45deg, #ffe6f0, #fff0f5);
  margin-top: 50px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.container {
  background-color: rgba(255, 255, 255, 0.9);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
  border: 3px dashed #ff69b4;
  max-width: 600px;
  width: 90%;
}

h1 {
  color: #d63384;
  font-size: 2.5em;
  text-shadow: 2px 2px 0 #ffb6c1;
  margin-bottom: 20px;
}

.subtitle {
  font-size: 1.2em;
  color: #ff4d6d;
  margin-bottom: 30px;
  background: #fff0f5;
  padding: 10px;
  border-radius: 50px;
  border: 2px solid #ffb6c1;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-top: 30px;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  margin: 10px;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  font-family: 'Comic Sans MS', 'Arial', sans-serif;
  font-weight: bold;
  transition: all 0.3s ease;
  box-shadow: 0 5px 0 rgba(0,0,0,0.1);
  position: relative;
}

.yes-button {
  background-color: #ff4d88;
  color: white;
  border: 2px solid #ff1a4c;
  transform-origin: center;
}

.yes-button:hover {
  transform: scale(1.05);
  background-color: #ff3385;
}

.no-button {
  background-color: #e0e0e0;
  color: #666;
  border: 2px solid #b3b3b3;
  transition: all 0.2s ease;
}

.no-button:hover {
  background-color: #d4d4d4;
}

/* Memes y cosas graciosas */
.joke-bubble {
  background-color: white;
  border-radius: 20px;
  padding: 10px 20px;
  margin: 10px auto;
  max-width: 300px;
  border: 2px solid #ffb6c1;
  position: relative;
  font-size: 1.1em;
}

.joke-bubble::before {
  content: "💭";
  position: absolute;
  left: -30px;
  top: -10px;
  font-size: 30px;
}

.funny-face {
  font-size: 50px;
  margin: 10px;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* Contador del botón No */
.no-counter {
  font-size: 0.9em;
  color: #999;
  margin-top: 10px;
}

.encouragement {
  background: #ffeb3b;
  color: #333;
  padding: 5px 15px;
  border-radius: 20px;
  font-weight: bold;
  display: inline-block;
  margin: 10px;
  transform: rotate(-2deg);
}
</style>
</head>

<body>
<div class="container">
  <div class="funny-face">😅🥺😂</div>
  <h1>🫣 ¿Quieres ser mi San Valentín? 🫣</h1>
  <div class="subtitle">
    *No te preocupes, no muerdo... mucho* 😬
  </div>
  
  <div id="jokeBox" class="joke-bubble">
    El botón de "No" está cada vez más chiquito... 👀
  </div>
  
  <div class="buttons">
    <button class="yes-button" onclick="handleYesClick()" id="yesButton">¡Sí, claro que sí! 💖</button>
    <button class="no-button" onclick="handleNoClick()" id="noButton">No 😅</button>
  </div>
  
  <div id="counter" class="no-counter">
    Veces que intentaste decir no: 0
  </div>
  
  <div class="encouragement" id="encouragement">
    ¡Anímate! Prometo portarme bien... o no 😈
  </div>
</div>

<script>
let messageIndex = 0;
let noClickCount = 0;
let yesButtonSize = 20; // tamaño inicial en px

const messages = [
  "¿Segura? ¡Qué rápida para decir no! 😱",
  "Pero... ¿y si te doy chocolates? 🍫",
  "¿Ni siquiera un 'lo pensaré'? 😭",
  "Mira que tengo memes muy buenos 🤡",
  "Vamos, dale una oportunidad al amor... o al menos al clic 🖱️",
  "Última oportunidad... ¡Estás desaprovechando! 🙈",
  "Bueno, ya me estoy encogiendo... 😰",
  "¡YA NO PUEDO ENCOGER MÁS! Ayuda 😂",
  "Me rindo... pero el otro botón ya es enorme 👀"
];

const jokes = [
  "El botón de 'No' se está escondiendo... 🫣",
  "Cada clic en 'No' hace más grande el amor... y el botón ❤️",
  "¡No seas mala! Mira cómo crece el otro botón 😳",
  "Este botón ya parece un globo a punto de explotar 🎈",
  "La resistencia es inútil... el amor siempre gana 💪",
  "Tu dedo debe estar cansado de tanto decir no 🖐️",
  "El botón del 'Sí' te está mirando fijamente... 👀",
  "Ya casi es más grande que mi autoestima 😂",
  "¡Ya ganó! Admítelo, vas a decir que sí 🏆"
];

const encouragements = [
  "¡Anímate! Prometo portarme bien... o no 😈",
  "El amor es como un meme: mejor si es compartido 💕",
  "No tengo flores, pero tengo chistes malos 🌸",
  "Si dices que sí, te cuento un chiste 🤡",
  "¡Haz clic en el botón grande! El rosa, el bonito ❤️",
  "El destino (y mi código) quieren que digas que sí ✨",
  "Vamos, sé valiente... ¡el amor te espera! 🦸‍♂️"
];

function handleNoClick() {
  const noButton = document.getElementById('noButton');
  const yesButton = document.getElementById('yesButton');
  const jokeBox = document.getElementById('jokeBox');
  const counter = document.getElementById('counter');
  const encouragement = document.getElementById('encouragement');
  
  // Contador de clicks
  noClickCount++;
  counter.textContent = `Veces que intentaste decir no: ${noClickCount}`;
  
  // Cambiar el texto del botón No
  noButton.textContent = messages[messageIndex];
  messageIndex = (messageIndex + 1) % messages.length;
  
  // Hacer crecer el botón Sí dramáticamente
  if (noClickCount <= 8) { // Limitamos el crecimiento para que no sea infinito
    yesButtonSize = 20 + (noClickCount * 8); // Crece 8px por cada clic
    yesButton.style.fontSize = `${yesButtonSize}px`;
    yesButton.style.padding = `${15 + noClickCount}px ${30 + (noClickCount * 3)}px`;
  } else {
    yesButton.style.fontSize = '85px'; // Tamaño máximo divertido
    yesButton.style.padding = '25px 60px';
  }
  
  // Cambiar el chiste
  jokeBox.textContent = jokes[Math.floor(Math.random() * jokes.length)];
  
  // Cambiar mensaje de ánimo
  encouragement.textContent = encouragements[Math.floor(Math.random() * encouragements.length)];
  
  // Hacer el botón No más pequeño
  const noCurrentSize = parseFloat(window.getComputedStyle(noButton).fontSize);
  if (noCurrentSize > 12) {
    noButton.style.fontSize = `${noCurrentSize * 0.9}px`;
  }
  
  // Efecto divertido - temblor
  noButton.style.transform = 'rotate(2deg)';
  setTimeout(() => {
    noButton.style.transform = 'rotate(-2deg)';
  }, 100);
  setTimeout(() => {
    noButton.style.transform = 'rotate(0deg)';
  }, 200);
  
  // Mensajes especiales según los clicks
  if (noClickCount === 5) {
    alert("¡5 veces! Eres más terco que mi ex 😂");
  } else if (noClickCount === 10) {
    alert("¡10 veces! Ya estás jugando conmigo... y con el botón 😜");
  }
}

function handleYesClick() {
  const container = document.querySelector('.container');
  
  // Respuesta graciosa y bonita
  container.innerHTML = `
    <div style="animation: bounce 1s">
      <div class="funny-face">🎉🥳💖</div>
      <h1 style="color: #d63384;">¡LO SABÍA! 💘</h1>
      <div style="font-size: 30px; margin: 20px;">🫂</div>
      <div class="joke-bubble" style="font-size: 1.3em;">
        "¡Era obvio! El botón del 'Sí' siempre gana... 
        <br>como en las películas de Disney 🏰"
      </div>
      <p style="font-size: 1.5em; margin: 20px;">¡Vamos por unos tacos para celebrar! 🌮</p>
      <p style="color: #666;">*Inserta aquí una cita romántica pero graciosa*</p>
      <p>Pd: Te lo dije, el botón creció hasta convencerte 😘</p>
    </div>
  `;
  
  // Confeti de corazones graciosos
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const emoji = document.createElement('div');
      emoji.style.position = 'fixed';
      emoji.style.left = Math.random() * 100 + '%';
      emoji.style.top = '-10%';
      emoji.style.fontSize = (Math.random() * 30 + 20) + 'px';
      emoji.style.animation = 'bounce 2s linear forwards';
      emoji.innerHTML = ['❤️','💖','💕','😂','🥰','🤡','🌮','🍕'][Math.floor(Math.random() * 8)];
      emoji.style.zIndex = '1000';
      document.body.appendChild(emoji);
      
      setTimeout(() => {
        emoji.remove();
      }, 2000);
    }, i * 100);
  }
}
</script>

<style>
/* Añadimos más estilos divertidos */
@media (max-width: 768px) {
  h1 { font-size: 2em; }
  .buttons { flex-direction: column-reverse; }
  .yes-button { order: 1; }
  .no-button { order: 2; }
}
</style>
</body>
</html>
